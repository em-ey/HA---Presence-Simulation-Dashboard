type: vertical-stack
cards:
  - type: tile
    entity: switch.anwesenheitssimulator
    name: Anwesenheitssimulation
    icon: mdi:home-clock-outline
    features:
      - type: toggle

  - type: markdown
    title: Übersicht
    content: >-
      {% set sim = states.switch.anwesenheitssimulator %}
      {% if is_state(sim.entity_id, 'on') %}
        🟢 **Simulation aktiv** · {{ state_attr(sim.entity_id, 'active_entity_count') | default(0, true) }} Entität(en) aktiv
      {% else %}
        ⚪ **Simulation ausgeschaltet**
      {% endif %}

      {% set next = state_attr(sim.entity_id, 'next_events') | default([], true) %}
      {% if next %}
        **Nächste Aktion**  
        `{{ next[0].datetime | as_timestamp | timestamp_custom('%a %d %b · %H:%M', true) }}` · **{{ state_attr(next[0].entity_id, 'friendly_name') or next[0].entity_id }}** → `{{ next[0].state }}`
      {% else %}
        _Es ist noch keine nächste Aktion geplant._
      {% endif %}

  - type: markdown
    title: Aktuell aktiv
    content: >-
      {% set active = state_attr('switch.anwesenheitssimulator', 'active_entities') | default([], true) %}
      {% if active %}
        {% for item in active %}
        - 💡 **{{ state_attr(item.entity_id, 'friendly_name') or item.entity_id }}** · `{{ item.state }}`
        {% endfor %}
      {% else %}
        _Derzeit ist keine überwachte Entität aktiv._
      {% endif %}

  - type: markdown
    title: Anstehende Planung
    content: >-
      {% set events = state_attr('switch.anwesenheitssimulator', 'next_events') | default([], true) %}
      {% if events %}
        {% for event in events %}
        - `{{ event.datetime | as_timestamp | timestamp_custom('%a %d %b · %H:%M', true) }}` · **{{ state_attr(event.entity_id, 'friendly_name') or event.entity_id }}** → `{{ event.state }}`
        {% endfor %}
      {% else %}
        _Keine Aktionen geplant._
      {% endif %}
